<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 304">
  <!-- Original capsule music player, sized to the 48×152 player slot.
       The screen area (x30 y98 w43 h128) lines up with the OLED text overlay. -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d838c"/>
      <stop offset="0.18" stop-color="#d9dde3"/>
      <stop offset="0.42" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#b9bfc7"/>
      <stop offset="1" stop-color="#6c727b"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0c10"/>
      <stop offset="0.35" stop-color="#3a3d45"/>
      <stop offset="0.55" stop-color="#1c1e24"/>
      <stop offset="1" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62f3f0"/>
      <stop offset="0.5" stop-color="#2fd8dc"/>
      <stop offset="1" stop-color="#18b3c0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#b8fffb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b8fffb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- key ring -->
  <circle cx="52" cy="10" r="7" fill="none" stroke="#8b9098" stroke-width="3"/>
  <circle cx="52" cy="10" r="7" fill="none" stroke="#e7eaee" stroke-width="1" stroke-dasharray="6 5"/>
  <rect x="49" y="15" width="6" height="10" rx="2" fill="#5b6068"/>

  <!-- top cap -->
  <rect x="22" y="22" width="60" height="54" rx="12" fill="url(#cap)" stroke="#000" stroke-width="2"/>
  <rect x="27" y="27" width="50" height="5" rx="2.5" fill="#ffffff" opacity="0.12"/>
  <g stroke="#000" stroke-width="1.6" opacity="0.7">
    <line x1="24" y1="46" x2="80" y2="46"/>
    <line x1="24" y1="52" x2="80" y2="52"/>
    <line x1="24" y1="58" x2="80" y2="58"/>
  </g>

  <!-- metal body -->
  <rect x="24" y="72" width="56" height="168" rx="4" fill="url(#metal)" stroke="#2b2e34" stroke-width="2"/>
  <rect x="29" y="72" width="3" height="168" fill="#ffffff" opacity="0.55"/>

  <!-- screen bezel + screen -->
  <rect x="27" y="94" width="49" height="136" rx="6" fill="#0d2a31" stroke="#000" stroke-width="1.5"/>
  <rect x="30" y="98" width="43" height="128" rx="4" fill="url(#screen)"/>
  <rect x="30" y="98" width="43" height="128" rx="4" fill="url(#glow)"/>
  <rect x="32" y="100" width="39" height="124" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
  <path d="M33 102 L50 102 L36 140 L33 140 Z" fill="#ffffff" opacity="0.18"/>

  <!-- side buttons (skip / volume) -->
  <rect x="80" y="100" width="6" height="22" rx="2" fill="#24272d" stroke="#000" stroke-width="1"/>
  <rect x="80" y="204" width="6" height="22" rx="2" fill="#24272d" stroke="#000" stroke-width="1"/>

  <!-- bottom cap -->
  <rect x="22" y="236" width="60" height="58" rx="12" fill="url(#cap)" stroke="#000" stroke-width="2"/>
  <g stroke="#000" stroke-width="1.6" opacity="0.7">
    <line x1="24" y1="250" x2="80" y2="250"/>
    <line x1="24" y1="256" x2="80" y2="256"/>
    <line x1="24" y1="262" x2="80" y2="262"/>
  </g>
  <rect x="27" y="241" width="50" height="4" rx="2" fill="#ffffff" opacity="0.1"/>
  <circle cx="52" cy="281" r="5.5" fill="#050608" stroke="#5b6068" stroke-width="1.5"/>
  <circle cx="52" cy="281" r="2" fill="#2fd8dc" opacity="0.8"/>
</svg>
